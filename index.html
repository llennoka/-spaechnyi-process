<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Риск спаечного процесса</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#2563eb;--primary-hover:#1d4ed8;--bg-color:#f3f4f6;--card-bg:#ffffff;--text-main:#111827;--text-muted:#4b5563;--border-color:#d1d5db;--green:#10b981;--yellow:#f59e0b;--red:#ef4444}
        body{font-family:'Inter',sans-serif;background-color:var(--bg-color);color:var(--text-main);line-height:1.5;margin:0;padding:20px}
        .container{max-width:760px;margin:0 auto;background:var(--card-bg);padding:32px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
        h2{font-size:24px;font-weight:700;margin:0 0 24px;padding-bottom:16px;border-bottom:2px solid var(--bg-color)}
        .section{margin-bottom:32px;padding:24px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
        .field{display:flex;flex-direction:column;gap:6px}
        label{font-size:14px;font-weight:600;color:var(--text-muted)}
        input,select{padding:10px 12px;border:1px solid var(--border-color);border-radius:6px;font-family:inherit;font-size:14px;width:100%;box-sizing:border-box}
        .btn-group{display:flex;gap:12px;margin-top:24px}
        button{flex:1;padding:14px 24px;font-size:16px;font-weight:600;border:none;border-radius:8px;cursor:pointer;color:#fff}
        .btn-primary{background:var(--primary)} .btn-secondary{background:#e5e7eb;color:#374151}
        #result-screen{display:none}
        .result-card{border-radius:12px;padding:32px;margin-bottom:24px;border-left:8px solid;background:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
        .risk-low{border-color:var(--green);background:#ecfdf5} .risk-mod{border-color:var(--yellow);background:#fffbeb} .risk-high{border-color:var(--red);background:#fef2f2}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:15px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid rgba(0,0,0,0.1)}
    </style>
</head>
<body>
<div class="container">
    <h2 id="main-title">Оценка риска развития спаечного процесса</h2>
    <form id="form-screen">
        <div class="section">
            <div class="grid">
                <div class="field"><label>ФИО пациента</label><input type="text" id="p_name" required></div>
                <div class="field"><label>Номер палаты</label><input type="text" id="p_room" required></div>
            </div>
        </div>
        <div class="section">
            <div class="grid">
                <div class="field"><label>Предыдущие операции (брюшная полость)</label>
                    <select class="val-select" data-label="Предыдущие операции"><option value="0|Нет">Нет</option><option value="1|1 операция">1 операция</option><option value="2|2-3 операции">2-3 операции</option><option value="3|>3 операций">>3 операций</option></select>
                </div>
                <div class="field"><label>Воспалительные заболевания</label>
                    <select class="val-select" data-label="Воспалительные заболевания"><option value="0|Нет">Нет</option><option value="1|1 заболевание">1 заболевание</option><option value="2|2 заболевания">2 заболевания</option><option value="3|>2 заболеваний">>2 заболеваний</option></select>
                </div>
                <div class="field"><label>Наследственность</label>
                    <select class="val-select" data-label="Наследственность"><option value="0|Не отягощена">Не отягощена</option><option value="1|Возможная предрасположенность">Возможная предрасположенность</option><option value="2|Вероятная предрасположенность">Вероятная предрасположенность</option><option value="3|Отягощена">Отягощена</option></select>
                </div>
                <div class="field"><label>Уровень фибриногена (г/л)</label>
                    <select class="val-select" data-label="Фибриноген"><option value="0|<3,0 г/л"><3,0 г/л</option><option value="1|3,0-4,0 г/л">3,0-4,0 г/л</option><option value="2|4,0-5,0 г/л">4,0-5,0 г/л</option><option value="3|>5,0 г/л">>5,0 г/л</option></select>
                </div>
                <div class="field"><label>Тип операции</label>
                    <select class="val-select" data-label="Тип операции"><option value="0|Лапароскопия">Лапароскопия</option><option value="1|Мини-лапаротомия">Мини-лапаротомия</option><option value="2|Лапаротомия">Лапаротомия</option><option value="3|Резекция кишечника">Резекция кишечника</option></select>
                </div>
            </div>
        </div>
        <div class="btn-group"><button type="button" class="btn-primary" onclick="calc()">Рассчитать риск</button></div>
    </form>
    <div id="result-screen">
        <div class="result-card" id="res_card">
            <h3 id="res_title" style="margin-top:0"></h3>
            <div class="info-grid">
                <div>Пациент: <span id="out_name"></span></div>
                <div>Палата: <span id="out_room"></span></div>
                <div>Суммарный балл: <span id="out_score"></span></div>
            </div>
            <strong>Факторы:</strong><ul id="out_factors" style="margin-top:8px"></ul>
        </div>
        <div class="btn-group"><button class="btn-primary" onclick="location.reload()">Новый расчет</button></div>
    </div>
</div>
<script>
    function calc() {
        let sc=0, fact=[];
        document.querySelectorAll('.val-select').forEach(s=>{ let p=s.value.split('|'), pts=parseInt(p[0]); if(pts>0){ sc+=pts; fact.push(`${s.dataset.label}: ${p[1]}`); } });
        let cl = sc>=11?"risk-high":sc>=6?"risk-mod":"risk-low", t = sc>=11?"🔴 Высокий риск":sc>=6?"🟡 Умеренный риск":"🟢 Низкий риск";
        
        document.getElementById('out_name').innerText=document.getElementById('p_name').value||"-";
        document.getElementById('out_room').innerText=document.getElementById('p_room').value||"-";
        document.getElementById('out_score').innerText=sc;
        document.getElementById('res_card').className="result-card "+cl; document.getElementById('res_title').innerText=t;
        let fl=document.getElementById('out_factors'); fl.innerHTML=""; fact.forEach(f=>{ let li=document.createElement('li'); li.innerText=f; fl.appendChild(li); });
        
        // ОТПРАВКА В GOOGLE ТАБЛИЦУ
        let formData = new FormData();
        formData.append("sheetName", "Спаечный процесс");
        formData.append("data", JSON.stringify([document.getElementById('p_name').value||"-", document.getElementById('p_room').value||"-", sc, t, fact.join(" | ")]));
        fetch("https://script.google.com/macros/s/AKfycby3oLTKfR-6hKtQ1pmSSARXTiVvm_IbhSpp2nM52A5C0z_cXw9oNn09GbztTGFMrlF8/exec", { method: "POST", mode: "no-cors", body: formData });

        document.getElementById('form-screen').style.display='none'; document.getElementById('result-screen').style.display='block';
    }
</script>
</body>
</html>
